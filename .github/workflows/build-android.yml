name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.sofikuw --project-name reve .

      - name: Allow network access in release builds
        # flutter create only grants INTERNET in the debug/profile manifests, so a
        # release APK fails with "Failed host lookup: github.com".
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n\n    <application',
                  1,
              )
              p.write_text(s)
          print(s.split('<application')[0][-260:])
          PY

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=OAUTH_CLIENT_ID="${{ vars.OAUTH_CLIENT_ID }}" \
            --dart-define=OAUTH_SCOPE="${{ vars.OAUTH_SCOPE || 'repo' }}"

      - name: Rename artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/reve-${GITHUB_REF_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reve-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
