name: Release Android APKs

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel'
        type: choice
        options: [alpha, beta, stable]
        default: beta
      version:
        description: 'Version name, e.g. 1.0.0 (blank = the version in pubspec.yaml)'
        type: string
        default: ''
      version_code:
        description: 'Android version code (blank = derived from version + build number)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

env:
  # 21, not 17: the lint that ships with AGP calls List.removeLast(), which only
  # exists in Java 21 — on 17 `lintVitalAnalyzeRelease` dies in a plugin module.
  JAVA_VERSION: '21'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags decide the next build number, so the whole tag list is needed.
          fetch-depth: 0

      - name: Work out version, build number and tag
        id: ver
        env:
          CHANNEL: ${{ inputs.release_channel }}
          VERSION_INPUT: ${{ inputs.version }}
          CODE_INPUT: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          channel="$CHANNEL"
          version="${VERSION_INPUT#v}"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi

          # #001, #002, … per version + channel: the highest tag wins, so the
          # number always says which build is the newest for that version.
          last=$(git tag -l "v${version}-${channel}.*" | sed 's/.*\.//' | sort -n | tail -1)
          build=$(printf '%03d' $((10#${last:-0} + 1)))

          tag="v${version}-${channel}.${build}"

          IFS=. read -r major minor patch <<< "$version"
          if [ -n "$CODE_INPUT" ] && ! printf '%s' "$CODE_INPUT" | grep -Eq '^[0-9]+$'; then
            echo "::error::version_code '$CODE_INPUT' is not a number"
            exit 1
          fi
          # rank makes stable installable over beta over alpha of the same
          # version instead of "app not installed" (lower version code).
          case "$channel" in
            alpha) rank=0 ;;
            beta) rank=1 ;;
            *) rank=2 ;;
          esac
          # The version line restarted at 1.0.0; builds up to 1.3.0 shipped with
          # codes around 103000000. The epoch keeps 1.0.0 installable over them
          # without an uninstall, while staying far below Android's 2.1e9 cap.
          epoch=100000000
          code=${CODE_INPUT:-$(( epoch + (major * 10000 + minor * 100 + patch) * 10000 + rank * 1000 + 10#${build} ))}

          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "building $version $channel #$build (code $code, tag $tag)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch photo_gallery for the current Android Gradle Plugin
        # photo_gallery 2.2.1 predates AGP 8, which requires an explicit
        # namespace in every library module.
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          root = pathlib.Path.home() / '.pub-cache/hosted/pub.dev'
          for p in root.glob('photo_gallery-*/android/build.gradle'):
              s = p.read_text()
              if 'namespace ' not in s:
                  s = s.replace('android {\n', 'android {\n    namespace "com.morbit.photogallery"\n', 1)
              s = s.replace('compileSdkVersion 33', 'compileSdkVersion 36')
              p.write_text(s)
              print('patched build.gradle', p)
          for p in root.glob('photo_gallery-*/android/src/main/kotlin/**/PhotoGalleryPlugin.kt'):
              s = p.read_text()
              s = re.sub(r'\nimport io\.flutter\.plugin\.common\.PluginRegistry\.Registrar', '', s)
              s = re.sub(
                  r'\s*@JvmStatic\s*fun registerWith\(registrar: Registrar\)\s*\{[^}]*\}',
                  '\n', s, count=1,
              )
              p.write_text(s)
              print('patched registrar', p)
          PY

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.sofikuw --project-name reve .

      - name: Configure Android SDK for notifications plugin
        # flutter_local_notifications needs a newer compileSdk and Java 8
        # library desugaring on modern Flutter templates.
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 37', s, count=1)
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace(
                  '    compileOptions {\n',
                  '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n',
                  1,
              )
          if 'coreLibraryDesugaring(' not in s:
              s = s.replace(
                  'dependencies {\n',
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n',
                  1,
              )
          p.write_text(s)
          print(s[:800])
          PY

      - name: Install app icons
        # assets/android holds the legacy mipmaps, the adaptive-icon foregrounds
        # for every density, mipmap-anydpi-v26/ic_launcher.xml and the
        # background colour, so every launcher mask shape is covered.
        run: cp -r assets/android/. android/app/src/main/res/

      - name: Allow network access and APK installs in release builds
        # flutter create only grants INTERNET in the debug/profile manifests, so a
        # release APK fails with "Failed host lookup: github.com". Installing an
        # update from inside the app also needs REQUEST_INSTALL_PACKAGES on Android 8+.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for permission in (
              'android.permission.INTERNET',
              'android.permission.REQUEST_INSTALL_PACKAGES',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.POST_NOTIFICATIONS',
          ):
              if permission not in s:
                  s = s.replace(
                      '<application',
                      f'<uses-permission android:name="{permission}"/>\n\n    <application',
                      1,
                  )
          p.write_text(s)
          print(s.split('<application')[0][-400:])
          PY

      - name: Restore the release signing key
        # Every APK signed by this job must use the same key, otherwise Android
        # refuses to install a new build over the old one ("app not installed").
        # The key lives in a repository secret and is written where AGP's default
        # debug signing config looks for it.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set — without it every run signs with a new key and upgrades break."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - name: Build split APKs
        # --build-name/--build-number override pubspec.yaml, so a build can carry
        # any version without editing the file.
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="${{ steps.ver.outputs.code }}" \
            --dart-define=OAUTH_CLIENT_ID="${{ vars.OAUTH_CLIENT_ID }}" \
            --dart-define=OAUTH_SCOPE="${{ vars.OAUTH_SCOPE || 'repo' }}" \
            --dart-define=APP_VERSION="${{ steps.ver.outputs.version }}" \
            --dart-define=APP_BUILD="${{ steps.ver.outputs.build }}" \
            --dart-define=APP_CHANNEL="${{ inputs.release_channel }}"

      - name: Collect APKs
        run: |
          mkdir -p out
          version="${{ steps.ver.outputs.version }}"
          channel="${{ inputs.release_channel }}"
          build="${{ steps.ver.outputs.build }}"
          # Flutter adds an ABI-specific offset on top of --build-number, so the
          # code written into each APK differs from the one computed above. Read
          # it back instead of advertising a number no APK carries.
          aapt=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 | tail -1)
          : > out/codes.txt
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk)
            abi=${abi#app-}
            cp "$apk" "out/reve-${version}-${channel}-${build}-${abi}.apk"
            code=$("$aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            test -n "$code"
            echo "$abi $code" >> out/codes.txt
          done
          test "$(ls -1 out/*.apk | wc -l)" -eq 3

          # Same fingerprint on every release is what makes an in-place upgrade
          # work; publish it so a mismatch is visible before anyone installs.
          apksigner=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs "$(ls out/*.apk | head -1)" > out/certs.txt
          grep 'SHA-256' out/certs.txt | sed 's/^.*: //' > out/fingerprint.txt
          cat out/fingerprint.txt

          ls -lh out
          cat out/codes.txt

      - name: Categorized summary of changes
        run: |
          python3 > summary.md <<'PY'
          import re
          import subprocess


          def run(*args):
              return subprocess.run(args, capture_output=True, text=True)


          # The last build can be on any version/channel (1.0.1, 1.3.0, …),
          # so ask git for the closest reachable tag instead of filtering by
          # the version we are building now — otherwise a new version starts
          # its notes with the entire project history.
          previous = run(
              "git", "describe", "--tags", "--abbrev=0",
              "--match", "v[0-9]*", "HEAD",
          ).stdout.strip()
          rng = f"{previous}..HEAD" if previous else "HEAD"
          out = run("git", "log", "--pretty=%s", rng).stdout
          subjects = [s for s in (line.strip() for line in out.splitlines()) if s]


          def cat(subject):
              m = re.match(r"^(\w+)(?:\([^)]*\))?!?:?\s*(.*)$", subject)
              typ = m.group(1).lower() if m else ""
              # Housekeeping is not a user-facing change; it does not belong
              # in a release note next to features and fixes.
              if typ in ("chore", "docs", "ci", "build", "test"):
                  return None
              if m and typ == "feat":
                  return "added"
              if m and typ == "fix":
                  return "fixed"
              if m and typ in ("refactor", "perf", "style"):
                  return "changed"
              if re.search(r"\b(remove|removed|deleted?|drop(?:ped|s)?|clean ?up)\b", subject, re.I):
                  return "removed"
              return None


          sections = {"added": [], "changed": [], "fixed": [], "removed": []}
          for s in subjects:
              key = cat(s)
              if key:
                  sections[key].append(s)

          for key, title in (
              ("added", "Added"),
              ("changed", "Changed"),
              ("fixed", "Fixed"),
              ("removed", "Removed"),
          ):
              if not sections[key]:
                  continue
              print(f"### {title}\n")
              for s in sections[key]:
                  print(f"- {s}")
              print()
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          version='${{ steps.ver.outputs.version }}'
          build='${{ steps.ver.outputs.build }}'
          tag='${{ steps.ver.outputs.tag }}'

          {
            printf '**reve %s · %s #%s**\n\n' "$version" "$CHANNEL" "$build"
            if [ -s summary.md ]; then cat summary.md; echo; fi
            printf "Split APKs: install the one that matches your phone's CPU.\n\n"
            printf '| APK | Version code | Use it for |\n'
            printf '| --- | --- | --- |\n'
            while read -r abi code; do
              case "$abi" in
                arm64-v8a) use='almost every phone from ~2016 on' ;;
                armeabi-v7a) use='older 32-bit phones' ;;
                x86_64) use='emulators and Intel tablets' ;;
                *) use='' ;;
              esac
              printf '| `%s` | `%s` | %s |\n' "$abi" "$code" "$use"
            done < out/codes.txt
            printf '\nSigning certificate SHA-256: `%s`\n' "$(cat out/fingerprint.txt)"
          } > notes.md

          flags=(--title "reve $version · $CHANNEL #$build" --notes-file notes.md --generate-notes)
          if [ "$CHANNEL" = stable ]; then
            flags+=(--latest)
          else
            flags+=(--prerelease)
          fi
          gh release create "$tag" out/*.apk "${flags[@]}"
