# Cloudflare Worker deployment for the reve OAuth broker.
#
#   npm i -g wrangler
#   wrangler login
#   wrangler secret put GITHUB_CLIENT_ID      # required (device flow + popup)
#   wrangler secret put GITHUB_CLIENT_SECRET  # popup flow only
#   wrangler secret put ALLOWED_ORIGINS       # optional: https://you.github.io
#   wrangler deploy
#
# Device flow needs no client secret. Only the web popup flow does.
#
# Then register https://<name>.<subdomain>.workers.dev/api/oauth
# as the OAuth App callback URL on github.com/settings/developers.

name = "reve-oauth"
main = "src/index.js"
compatibility_date = "2026-03-01"

# Bare origins, no trailing slash. The web app is served from both URLs, so
# both must be listed or the browser will refuse the response.
[vars]
ALLOWED_ORIGINS = "https://sofikuw.is-not-a.dev,https://sofikuw.github.io"

# Secrets are set with `wrangler secret put`, never committed here.
