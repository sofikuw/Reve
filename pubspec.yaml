name: reve
description: "Reve - turn GitHub repositories into personal cloud storage, with a MiXplorer-style file manager and Material 3 UI."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.0.0 <2.0.0"
  url_launcher: ">=6.0.0 <7.0.0"
  provider: ">=6.0.0 <7.0.0"
  file_picker: "^12.0.0"
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"

flutter:
  uses-material-design: true
