name: reve
description: "Reve - turn GitHub repositories into personal cloud storage, with a MiXplorer-style file manager and Material 3 UI."
publish_to: "none"

version: 1.0.2+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.0.0 <2.0.0"
  url_launcher: ">=6.0.0 <7.0.0"
  provider: ">=6.0.0 <7.0.0"
  file_picker: "^12.0.0"
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  video_player: ^2.9.0
  photo_gallery: ^2.2.1
  permission_handler: ^12.0.0
  share_plus: ^13.3.1
  connectivity_plus: 7.3.1
  flutter_local_notifications: ^23.0.4
  encrypt: ^5.0.3
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon-192.png
    - assets/icon-512.png
